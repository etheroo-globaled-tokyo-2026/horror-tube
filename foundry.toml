[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["contracts/lib"]
cache_path = "contracts/cache"
broadcast = "contracts/broadcast"
solc = "0.8.37"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=contracts/lib/forge-std/src/",
  "@openzeppelin/contracts/=contracts/lib/openzeppelin-contracts/contracts/",
]
# The deploy script and fork test read ENS addresses from the pinned table.
fs_permissions = [{ access = "read", path = "./scripts/pin" }]
# Fork tests need SEPOLIA_RPC_URL and network access; run them with FOUNDRY_PROFILE=fork.
no_match_path = "**/test/fork/**"

[profile.fork]
no_match_path = "**/test/unit/**"

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
