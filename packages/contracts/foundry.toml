[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.37"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
# The deploy and e2e scripts and the fork test read ENS addresses from the pinned table.
fs_permissions = [{ access = "read", path = "../ens/scripts/pin" }]
# Fork tests need SEPOLIA_RPC_URL and network access; run them with FOUNDRY_PROFILE=fork.
no_match_path = "**/test/fork/**"

[profile.fork]
no_match_path = "**/test/unit/**"

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
