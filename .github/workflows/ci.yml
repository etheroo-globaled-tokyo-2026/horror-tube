name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @horror-tube/ens test
      - run: pnpm --filter @horror-tube/ens typecheck
      - run: python3 scripts/test_spaces_credential_process.py
