name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @horror-tube/ens test
      - run: pnpm --filter @horror-tube/ens typecheck
      - run: python3 scripts/test_spaces_credential_process.py

  fight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @horror-tube/fight-media build
      - run: pnpm --filter @horror-tube/fight build
      - run: pnpm --filter @horror-tube/fight test
      - run: pnpm --filter @horror-tube/fight typecheck

  fight-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @horror-tube/fight-media build
      - run: pnpm --filter @horror-tube/fight-media test
      - run: pnpm --filter @horror-tube/fight-media typecheck

  world-id:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @horror-tube/world-id build
      - run: pnpm --filter @horror-tube/world-id test
      - run: pnpm --filter @horror-tube/world-id typecheck

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @horror-tube/world-id build
      - run: pnpm --filter @horror-tube/fight-media build
      - run: pnpm --filter @horror-tube/fight build
      - run: pnpm --filter @horror-tube/server test
      - run: pnpm --filter @horror-tube/server typecheck

  betting-move:
    runs-on: ubuntu-latest
    env:
      SUI_RELEASE: testnet-v1.80.1
    steps:
      - uses: actions/checkout@v4
      - id: sui-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/sui
          key: sui-${{ env.SUI_RELEASE }}-ubuntu-x86_64
      - name: Install Sui CLI
        if: steps.sui-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/MystenLabs/sui/releases/download/${SUI_RELEASE}/sui-${SUI_RELEASE}-ubuntu-x86_64.tgz" \
            | tar -xz -C "$HOME/.local/bin" ./sui
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: sui move test --path packages/betting/move

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @horror-tube/web test
      - run: pnpm --filter @horror-tube/web typecheck

  docker:
    runs-on: ubuntu-latest
    env:
      GAME_PORT: "8080"
      # Build-time only for the Vite client (apps/web/game.ts). Not defaults in app source.
      ENS_LABEL: "ci"
      VITE_SEPOLIA_RPC_URL: "https://ethereum-sepolia-rpc.publicnode.com"
      # Runtime roster read (apps/server/src/index.ts). The server reads each
      # label's ENS status before listen. jason and freddy are registered
      # under horrortube.eth.
      SERVER_ENS_LABEL: "horrortube"
      SEPOLIA_RPC_URL: "https://ethereum-sepolia-rpc.publicnode.com"
      # Runtime World ID gate (apps/server/src/index.ts). CI-only values; not production secrets.
      WORLD_ID_APP_ID: "app_ci_docker"
      WORLD_ID_RP_ID: "rp_ci_docker"
      WORLD_ID_SIGNING_KEY: "0xabababababababababababababababababababababababababababababababab"
      WORLD_ID_ENVIRONMENT: "production"
      WORLD_ID_PRACTICE_ACTIONS: "enter-room-1,enter-room-2,enter-room-3,enter-room-4,enter-room-5"
      WORLD_ID_JUDGE_ACTION: "enter-room-judge"
      # Runtime game-loop env (docs/game-loop.md). Required by @horror-tube/server; no defaults.
      QUORUM_VOTES: "1"
      VOTE_COUNTDOWN_SECONDS: "15"
      BET_MIN_SECONDS: "10"
      VIDEO_TIMEOUT_SECONDS: "300"
      SETTLE_SECONDS: "8"
      SKIP_BATTLE_SETTLEMENT: "1"
      ROSTER_ENS_LABELS: "jason,freddy"
      # Startup requires these. The key and pepper are not real. The coin type is public testnet USDC so the tag check passes. CI does not send a transaction.
      SHINAMI_ACCESS_KEY: "ci-not-a-real-shinami-key"
      WALLET_SECRET_PEPPER: "ci-wallet-pepper"
      SUI_USDC_TYPE: "0xa1ec7fc00a6f40db9693ad1415d0c193ad3906494428cf252621037bd7117e29::usdc::USDC"
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: >
          docker build
          --build-arg "ENS_LABEL=${ENS_LABEL}"
          --build-arg "VITE_SEPOLIA_RPC_URL=${VITE_SEPOLIA_RPC_URL}"
          -t horror-tube:ci .
      - name: Run Postgres with TLS and check health + ffmpeg + index
        run: |
          set -euo pipefail
          net="horror-tube-ci-$$"
          docker network create "$net"
          docker volume create ht-pg-certs
          docker run --rm -v ht-pg-certs:/certs alpine:3.20 sh -c '
            set -euo pipefail
            apk add --no-cache openssl >/dev/null
            openssl req -x509 -newkey rsa:2048 -nodes \
              -keyout /certs/ca.key -out /certs/ca.crt \
              -days 1 -subj "/CN=horror-tube-ci-ca"
            openssl req -newkey rsa:2048 -nodes \
              -keyout /certs/server.key -out /certs/server.csr \
              -subj "/CN=ht-pg" \
              -addext "subjectAltName=DNS:ht-pg,DNS:localhost"
            openssl x509 -req -in /certs/server.csr \
              -CA /certs/ca.crt -CAkey /certs/ca.key -CAcreateserial \
              -out /certs/server.crt -days 1 -copy_extensions copy
            # postgres alpine runs as uid 70
            chown -R 70:70 /certs
            chmod 600 /certs/server.key /certs/ca.key
            chmod 644 /certs/server.crt /certs/ca.crt
          '
          pg_cid="$(docker run -d --name ht-pg --network "$net" \
            -e POSTGRES_PASSWORD=ci \
            -e POSTGRES_USER=ci \
            -e POSTGRES_DB=ci \
            -v ht-pg-certs:/certs:ro \
            postgres:16-alpine \
            -c ssl=on \
            -c ssl_cert_file=/certs/server.crt \
            -c ssl_key_file=/certs/server.key)"
          for i in $(seq 1 60); do
            if docker exec "$pg_cid" pg_isready -U ci -d ci >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "postgres not ready" >&2
              docker logs "$pg_cid" >&2
              exit 1
            fi
            sleep 1
          done
          DATABASE_URL="postgres://ci:ci@ht-pg:5432/ci"
          DATABASE_CA_CERT="$(docker run --rm -v ht-pg-certs:/certs:ro alpine:3.20 \
            cat /certs/ca.crt | base64 -w0 2>/dev/null || docker run --rm -v ht-pg-certs:/certs:ro alpine:3.20 \
            cat /certs/ca.crt | base64 | tr -d '\n')"
          cid="$(docker run -d --network "$net" \
            -e "GAME_PORT=${GAME_PORT}" \
            -e "DATABASE_URL=${DATABASE_URL}" \
            -e "DATABASE_CA_CERT=${DATABASE_CA_CERT}" \
            -e "WORLD_ID_APP_ID=${WORLD_ID_APP_ID}" \
            -e "WORLD_ID_RP_ID=${WORLD_ID_RP_ID}" \
            -e "WORLD_ID_SIGNING_KEY=${WORLD_ID_SIGNING_KEY}" \
            -e "WORLD_ID_ENVIRONMENT=${WORLD_ID_ENVIRONMENT}" \
            -e "WORLD_ID_PRACTICE_ACTIONS=${WORLD_ID_PRACTICE_ACTIONS}" \
            -e "WORLD_ID_JUDGE_ACTION=${WORLD_ID_JUDGE_ACTION}" \
            -e "QUORUM_VOTES=${QUORUM_VOTES}" \
            -e "VOTE_COUNTDOWN_SECONDS=${VOTE_COUNTDOWN_SECONDS}" \
            -e "BET_MIN_SECONDS=${BET_MIN_SECONDS}" \
            -e "VIDEO_TIMEOUT_SECONDS=${VIDEO_TIMEOUT_SECONDS}" \
            -e "SETTLE_SECONDS=${SETTLE_SECONDS}" \
            -e "SKIP_BATTLE_SETTLEMENT=${SKIP_BATTLE_SETTLEMENT}" \
            -e "ENS_LABEL=${SERVER_ENS_LABEL}" \
            -e "SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL}" \
            -e "ROSTER_ENS_LABELS=${ROSTER_ENS_LABELS}" \
            -e "SHINAMI_ACCESS_KEY=${SHINAMI_ACCESS_KEY}" \
            -e "WALLET_SECRET_PEPPER=${WALLET_SECRET_PEPPER}" \
            -e "SUI_USDC_TYPE=${SUI_USDC_TYPE}" \
            -p "${GAME_PORT}:${GAME_PORT}" \
            horror-tube:ci)"
          cleanup() {
            docker rm -f "$cid" >/dev/null 2>&1 || true
            docker rm -f "$pg_cid" >/dev/null 2>&1 || true
            docker network rm "$net" >/dev/null 2>&1 || true
            docker volume rm ht-pg-certs >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:${GAME_PORT}/health" | grep -q '"ok":true'; then
              break
            fi
            if [ "$i" -eq 45 ]; then
              echo "health check failed after 45 attempts" >&2
              docker logs "$cid" >&2
              docker logs "$pg_cid" >&2
              exit 1
            fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:${GAME_PORT}/health"
          index_code="$(curl -sS -o /tmp/horror-tube-index.html -w "%{http_code}" "http://127.0.0.1:${GAME_PORT}/")"
          if [ "${index_code}" != "200" ]; then
            echo "GET / expected 200, got ${index_code}" >&2
            docker logs "$cid" >&2
            exit 1
          fi
          docker exec "$cid" ffmpeg -version

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: forge fmt --check
      - run: forge test

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
