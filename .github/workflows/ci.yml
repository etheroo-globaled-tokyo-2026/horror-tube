name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @horror-tube/ens test
      - run: pnpm --filter @horror-tube/ens typecheck
      - run: python3 scripts/test_spaces_credential_process.py

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @horror-tube/server test
      - run: pnpm --filter @horror-tube/server typecheck

  docker:
    runs-on: ubuntu-latest
    env:
      GAME_PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t horror-tube:ci .
      - name: Run container and check health + ffmpeg
        run: |
          set -euo pipefail
          cid="$(docker run -d -e "GAME_PORT=${GAME_PORT}" -p "${GAME_PORT}:${GAME_PORT}" horror-tube:ci)"
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${GAME_PORT}/health" | grep -q '"ok":true'; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "health check failed after 30 attempts" >&2
              docker logs "$cid" >&2
              exit 1
            fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:${GAME_PORT}/health"
          docker exec "$cid" ffmpeg -version

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: forge fmt --check
      - run: forge test
