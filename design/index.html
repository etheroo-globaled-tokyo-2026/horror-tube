<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horror Tube</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="ht.css" />
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }
    </script>
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--soot);
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      #view.hot {
        cursor: pointer;
      }
      .hint {
        position: fixed;
        left: 24px;
        bottom: 24px;
        max-width: 52vw;
        padding: 10px 14px;
        background: var(--soot);
        box-shadow: inset 0 0 0 2px var(--grime);
        font: 700 16px/1.4 var(--f-osd);
        color: var(--bone);
        letter-spacing: 0.04em;
        pointer-events: none;
      }
      .hint:empty {
        display: none;
      }
      .hint b {
        color: var(--sulfur);
        font-weight: 700;
      }
      .demo {
        position: fixed;
        left: 24px;
        top: 20px;
        display: flex;
        gap: 16px;
      }
      .demo button {
        font: 400 12px/1 var(--f-osd);
        color: var(--grime);
        letter-spacing: 0.06em;
      }
      .demo button:hover {
        color: var(--rust);
      }
      .gate {
        position: fixed;
        z-index: 9;
        background: var(--soot);
      }
      .gate .btn {
        box-shadow: inset 0 0 0 2px var(--rust);
        color: var(--bone);
      }
      .gate .btn.primary {
        background: var(--bone);
        color: var(--soot);
        box-shadow: none;
      }
      .gate h1 {
        color: var(--blood);
      }
      #film {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p id="hint" class="hint"></p>
    <p class="demo">
      <button data-act="view">RECORDS · V</button><button data-act="skip">DEMO · SKIP ▸ N</button>
    </p>
    <canvas id="film"></canvas>
    <div hidden>
      <button data-act="cast" id="h-cast"></button><button data-act="bet" id="h-bet"></button
      ><button data-act="claim" id="h-claim"></button
      ><button data-act="reset" id="h-reset"></button>
    </div>
    <div id="gate" class="gate"></div>

    <script src="sprites.js"></script>
    <script src="game.js"></script>
    <script type="module">
      import * as THREE from "three";

      const V = (n) => HT.css("--" + n);
      const COL = {
        soot: V("soot"),
        char: V("char"),
        grime: V("grime"),
        rust: V("rust"),
        rustDeep: V("rust-deep"),
        blood: V("blood"),
        bloodDeep: V("blood-deep"),
        sulfur: V("sulfur"),
        bone: V("bone"),
      };
      const HINTS = [
        "Hasn't slept in days.",
        "Somebody still leaves the porch light on for them.",
        "Asked us not to call again.",
        "Keeps something under the pillow.",
        "Laughs at the wrong moments.",
        "Was a nice kid once.",
        "Doesn't talk. Doesn't stop.",
        "Writes letters nobody answers.",
        "Knows your name.",
        "Still owes us.",
        "Hums when nervous.",
        "Has been here the longest.",
        "Came in last week.",
        "Won't look at the camera.",
        "Asked about you.",
        "Sleeps with the light on.",
      ];
      const STAKES = [0.01, 0.03, 0.05];
      const num = (n) => String(n).padStart(2, "0");
      const hint = (ch) => HINTS[(ch.id * 7 + 3) % HINTS.length];
      const T = {
        page: 0,
        pageAt: 0,
        buf: "",
        reveal: -1,
        revealUntil: 0,
        stake: 1,
        hold: -1,
        holdN: 0,
        say: "",
        sayUntil: 0,
        phase: "",
      };

      const canvas = document.getElementById("view");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
      renderer.setPixelRatio(1);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(COL.soot);
      scene.fog = new THREE.Fog(COL.soot, 2.4, 6.5);
      const camera = new THREE.PerspectiveCamera(50, 16 / 9, 0.02, 20);
      scene.add(camera);
      function size() {
        renderer.setSize(Math.round(innerWidth / 1.6), Math.round(innerHeight / 1.6), false);
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
      }
      addEventListener("resize", size);
      size();

      let seedT = 7;
      const r = () => (seedT = (seedT * 1664525 + 1013904223) >>> 0) / 2 ** 32;
      const speckle = (g, w, h, cols, n) => {
        for (let i = 0; i < n; i++) {
          g.fillStyle = cols[(r() * cols.length) | 0];
          g.fillRect((r() * w) | 0, (r() * h) | 0, 1 + ((r() * 2) | 0), 1);
        }
      };
      const tex = (w, h, draw, repeat) => {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        draw(c.getContext("2d"), w, h);
        const t = new THREE.CanvasTexture(c);
        t.magFilter = THREE.NearestFilter;
        t.minFilter = THREE.NearestFilter;
        t.colorSpace = THREE.SRGBColorSpace;
        if (repeat) {
          t.wrapS = t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(...repeat);
        }
        return t;
      };
      const wallTex = tex(
        64,
        64,
        (g, w, h) => {
          g.fillStyle = COL.char;
          g.fillRect(0, 0, w, h);
          speckle(g, w, h, [COL.soot, COL.soot, COL.grime], 380);
          speckle(g, w, h, [COL.rustDeep], 60);
          for (let x = 0; x < 6; x++) {
            const sx = (r() * w) | 0;
            g.fillStyle = COL.rustDeep;
            for (let y = (r() * 20) | 0, l = 10 + r() * 40; y < l; y++)
              g.fillRect(sx + (y % 5 === 0 ? 1 : 0), y, 1, 1);
          }
          g.fillStyle = COL.soot;
          g.fillRect(0, 0, w, 1);
          g.fillRect(0, 0, 1, h);
          g.fillStyle = COL.grime;
          for (const y of [4, 60]) for (const x of [4, 20, 36, 52]) g.fillRect(x, y, 2, 2);
        },
        [4, 2],
      );
      const floorTex = tex(
        32,
        32,
        (g, w, h) => {
          g.fillStyle = COL.soot;
          g.fillRect(0, 0, w, h);
          g.fillStyle = COL.char;
          for (let i = 0; i < w; i += 4) {
            g.fillRect(i, 0, 1, h);
            g.fillRect(0, i, w, 1);
          }
          speckle(g, w, h, [COL.rustDeep, COL.grime], 60);
        },
        [8, 8],
      );
      const metalTex = (base) =>
        tex(32, 32, (g, w, h) => {
          g.fillStyle = base;
          g.fillRect(0, 0, w, h);
          speckle(g, w, h, [COL.soot, COL.grime], 70);
        });

      const lambert = (o) => new THREE.MeshLambertMaterial(o);
      const basic = (o) => new THREE.MeshBasicMaterial(o);
      const box = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
      const cyl = (rt, rb, h, m, seg = 16) =>
        new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);

      const wallM = lambert({ map: wallTex });
      const back = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 2.8), wallM);
      back.position.set(0, 1.4, -1.8);
      scene.add(back);
      for (const side of [-1, 1]) {
        const w = new THREE.Mesh(new THREE.PlaneGeometry(4, 2.8), wallM);
        w.position.set(side * 2.2, 1.4, 0.2);
        w.rotation.y = (-side * Math.PI) / 2;
        scene.add(w);
      }
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 4), lambert({ map: floorTex }));
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0, 0, 0.2);
      scene.add(floor);
      const ceil = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 4), lambert({ color: COL.soot }));
      ceil.rotation.x = Math.PI / 2;
      ceil.position.set(0, 2.8, 0.2);
      scene.add(ceil);
      const pipe = cyl(0.05, 0.05, 4.4, lambert({ map: metalTex(COL.rustDeep) }), 8);
      pipe.rotation.z = Math.PI / 2;
      pipe.position.set(0, 2.55, -1.7);
      scene.add(pipe);
      scene.add(new THREE.AmbientLight(COL.rustDeep, 0.9));
      const bulbLight = new THREE.PointLight(0xffd6a0, 4, 0, 2);
      bulbLight.position.set(-0.5, 2.2, -0.6);
      scene.add(bulbLight);
      const bulb = new THREE.Mesh(
        new THREE.SphereGeometry(0.05, 8, 6),
        basic({ color: COL.sulfur }),
      );
      bulb.position.copy(bulbLight.position);
      scene.add(bulb);
      const wire = box(0.008, 0.6, 0.008, basic({ color: COL.soot }));
      wire.position.set(-0.5, 2.5, -0.6);
      scene.add(wire);
      const table = box(1.4, 0.72, 0.8, lambert({ map: metalTex(COL.char) }));
      table.position.set(0, 0.36, -1.35);
      scene.add(table);

      const TW = 640,
        TH = 480;
      const tvCanvas = document.createElement("canvas");
      tvCanvas.width = TW;
      tvCanvas.height = TH;
      const tvCtx = tvCanvas.getContext("2d");
      const tvTex = new THREE.CanvasTexture(tvCanvas);
      tvTex.magFilter = THREE.LinearFilter;
      tvTex.minFilter = THREE.LinearFilter;
      tvTex.colorSpace = THREE.SRGBColorSpace;
      const tv = new THREE.Group();
      tv.position.set(0, 1.12, -1.4);
      scene.add(tv);
      tv.add(box(1.02, 0.8, 0.72, lambert({ map: metalTex(COL.grime) })));
      const bezel = box(0.86, 0.66, 0.02, lambert({ color: COL.soot }));
      bezel.position.set(-0.06, 0, 0.36);
      tv.add(bezel);
      const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.78, 0.585), basic({ map: tvTex }));
      screen.position.set(-0.06, 0, 0.372);
      tv.add(screen);
      for (const y of [0.18, 0.02]) {
        const k = cyl(0.035, 0.035, 0.04, lambert({ color: COL.char }), 10);
        k.rotation.x = Math.PI / 2;
        k.position.set(0.44, y, 0.37);
        tv.add(k);
      }
      const tvGlow = new THREE.PointLight(0xc8c8dc, 1.2, 0, 2);
      tvGlow.position.set(0, 1.1, -0.8);
      scene.add(tvGlow);

      const label = (text, bg, fg, w = 64, h = 48, font = 26) =>
        tex(w, h, (g) => {
          g.fillStyle = bg;
          g.fillRect(0, 0, w, h);
          g.fillStyle = fg;
          g.font = `700 ${font}px Silkscreen`;
          g.textAlign = "center";
          g.textBaseline = "middle";
          g.fillText(text, w / 2, h / 2 + 2);
        });
      const remote = new THREE.Group();
      remote.position.set(0.3, -0.1, -0.62);
      remote.rotation.set(-0.3, -0.22, -0.1);
      remote.scale.setScalar(0.82);
      camera.add(remote);
      const shell = box(0.13, 0.36, 0.035, lambert({ map: metalTex(COL.char) }));
      remote.add(shell);
      const faceLight = new THREE.PointLight(0xffd6a0, 0.25, 0.8, 2);
      faceLight.position.set(0.05, 0.05, 0.3);
      remote.add(faceLight);
      const led = new THREE.Mesh(
        new THREE.SphereGeometry(0.006, 6, 4),
        basic({ color: COL.bloodDeep }),
      );
      led.position.set(0, 0.165, 0.019);
      remote.add(led);
      const keys = [];
      const key = (id, text, x, y, w, h, bg, fg, font) => {
        const side = lambert({ color: bg });
        const m = box(w, h, 0.012, [
          side,
          side,
          side,
          side,
          basic({ map: label(text, bg, fg, Math.round(w * 1000), Math.round(h * 1000), font) }),
          side,
        ]);
        m.position.set(x, y, 0.022);
        m.keyId = id;
        remote.add(m);
        keys.push(m);
        return m;
      };
      key("A", "A", -0.03, 0.125, 0.05, 0.036, COL.bone, COL.soot, 22);
      key("B", "B", 0.03, 0.125, 0.05, 0.036, COL.sulfur, COL.soot, 22);
      key("-", "VOL−", -0.03, 0.08, 0.05, 0.026, COL.grime, COL.bone, 11);
      key("+", "VOL+", 0.03, 0.08, 0.05, 0.026, COL.grime, COL.bone, 11);
      const pad = [
        ["1", "2", "3"],
        ["4", "5", "6"],
        ["7", "8", "9"],
        ["clr", "0", "ok"],
      ];
      pad.forEach((row, ri) =>
        row.forEach((k, ci) => {
          const special = k === "ok" || k === "clr";
          key(
            k,
            k.toUpperCase(),
            -0.04 + ci * 0.04,
            0.035 - ri * 0.036,
            0.034,
            0.03,
            k === "ok" ? COL.rust : COL.grime,
            special ? COL.soot : COL.bone,
            special ? 11 : 20,
          );
        }),
      );
      const keyById = Object.fromEntries(keys.map((k) => [k.keyId, k]));

      const video = document.createElement("video");
      video.src = DEMO.video;
      video.playsInline = true;
      video.preload = "auto";
      video.muted = true;
      const small = document.createElement("canvas");
      small.width = 160;
      small.height = 120;
      const sg = small.getContext("2d", { willReadFrequently: true });
      const RAMP = [COL.soot, COL.rustDeep, COL.rust, COL.bone].map((h) =>
        [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)),
      );
      let vidMode = "";
      function syncVideo() {
        const mode =
          S.phase === "fight" && isDemo(S.fighters)
            ? "live"
            : replaying() && isDemo(S.last.fighters)
              ? "rec"
              : "";
        if (mode === vidMode) return;
        vidMode = mode;
        if (!mode) return video.pause();
        video.currentTime = 0;
        video.loop = mode === "rec";
        video.muted = mode === "rec";
        video.play().catch(() => {
          video.muted = true;
          video.play();
        });
      }
      function crop(sw0, sh0, dw, dh) {
        let sw = sw0,
          sh = sw0 / (dw / dh);
        if (sh > sh0) {
          sh = sh0;
          sw = sh0 * (dw / dh);
        }
        return [(sw0 - sw) / 2, (sh0 - sh) / 2, sw, sh];
      }
      function videoFrame(dx = 0, dy = 0, dw = TW, dh = TH) {
        const w = 160,
          h = Math.round((160 * dh) / dw);
        if (small.height !== h) small.height = h;
        sg.drawImage(video, ...crop(832, 480, dw, dh), 0, 0, w, h);
        const img = sg.getImageData(0, 0, w, h),
          d = img.data;
        for (let i = 0; i < d.length; i += 4) {
          const l = Math.min(
              1,
              Math.max(0, ((0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2]) / 255 - 0.08) * 1.35),
            ),
            p = l * 3,
            k = Math.min(2, p | 0),
            f = p - k,
            red = d[i] > 110 && d[i] > d[i + 1] * 1.8;
          for (let c = 0; c < 3; c++) {
            const warm = RAMP[k][c] + (RAMP[k + 1][c] - RAMP[k][c]) * f;
            d[i + c] = red ? warm * 0.4 + d[i + c] * 0.6 : warm * 0.8 + d[i + c] * 0.2;
          }
        }
        sg.putImageData(img, 0, 0);
        const g = tvCtx,
          sy = dh / h;
        g.imageSmoothingEnabled = false;
        if (Math.random() < 0.05) {
          const y = (Math.random() * (h - 10)) | 0;
          g.drawImage(small, 0, 0, w, y, dx, dy, dw, y * sy);
          g.drawImage(small, 0, y, w, 10, dx + 24, dy + y * sy, dw, 10 * sy);
          g.drawImage(
            small,
            0,
            y + 10,
            w,
            h - y - 10,
            dx,
            dy + (y + 10) * sy,
            dw,
            (h - y - 10) * sy,
          );
        } else g.drawImage(small, 0, 0, w, h, dx, dy, dw, dh);
      }
      const guidePage = (now) => (T.page + Math.floor((now - T.pageAt) / 5000)) % 2;
      function drawGuide(now) {
        const g = tvCtx,
          W = TW,
          H = TH,
          top = 236,
          page = guidePage(now);
        g.fillStyle = COL.soot;
        g.fillRect(0, 0, W, H);
        const film = document.getElementById("film");
        if (vidMode && video.readyState >= 2) videoFrame(0, 0, W, top);
        else if (S.last && film.width) {
          g.imageSmoothingEnabled = false;
          g.drawImage(film, ...crop(160, 90, W, top), 0, 0, W, top);
        } else {
          g.fillStyle = COL.char;
          g.fillRect(0, 0, W, top);
          g.textAlign = "center";
          g.font = "700 26px Silkscreen";
          g.fillStyle = COL.bone;
          g.fillText("NOTHING HAS AIRED YET", W / 2, top / 2 + 8);
        }
        if (S.last) {
          g.textAlign = "left";
          if ((now / 500) % 2 < 1) {
            g.fillStyle = COL.blood;
            g.beginPath();
            g.arc(34, 38, 9, 0, Math.PI * 2);
            g.fill();
          }
          g.font = "700 24px Silkscreen";
          g.fillStyle = COL.bone;
          g.fillText("REC · LAST NIGHT", 52, 47);
        }
        g.fillStyle = COL.char;
        g.fillRect(0, top, W, H - top);
        g.fillStyle = COL.sulfur;
        g.fillRect(0, top, W, 32);
        g.fillStyle = COL.soot;
        g.textAlign = "left";
        g.font = "700 18px Silkscreen";
        g.fillText(S.cast ? "GOOD NIGHT." : "TONIGHT'S RESIDENTS", 16, top + 23);
        g.textAlign = "right";
        g.fillText(
          S.cast ? "YOUR PICKS ARE IN" : `TYPE A NUMBER · ${page + 1}/2`,
          W - 16,
          top + 23,
        );
        for (let i = 0; i < 16; i++) {
          const ch = S.chars[page * 16 + i];
          if (!ch) continue;
          const x = i < 8 ? 12 : W / 2 + 6,
            y = top + 32 + (i % 8) * 26,
            mine = S.picks.includes(ch.id);
          if (mine) {
            g.fillStyle = COL.bone;
            g.fillRect(x - 6, y + 2, W / 2 - 12, 24);
          }
          g.textAlign = "left";
          g.font = "700 20px Silkscreen";
          g.fillStyle = !ch.alive ? COL.grime : mine ? COL.soot : COL.sulfur;
          g.fillText(num(ch.id + 1), x, y + 22);
          g.font = "22px DotGothic16";
          g.fillStyle = !ch.alive ? COL.rust : mine ? COL.soot : COL.bone;
          g.fillText(ch.name, x + 44, y + 22);
          if (!ch.alive) {
            g.fillStyle = COL.rust;
            g.fillRect(x + 42, y + 14, g.measureText(ch.name).width + 4, 2);
          }
          if (mine) {
            g.textAlign = "right";
            g.font = "700 16px Silkscreen";
            g.fillText("✓ PICKED", x + W / 2 - 22, y + 21);
          }
        }
      }

      const wrap = (g, text, x, y, maxW, lh) => {
        let line = "";
        for (const word of text.split(" ")) {
          const test = line ? line + " " + word : word;
          if (g.measureText(test).width > maxW && line) {
            g.fillText(line, x, y);
            y += lh;
            line = word;
          } else line = test;
        }
        if (line) g.fillText(line, x, y);
        return y + lh;
      };
      const say = (text, ms = 3600) => {
        T.say = text;
        T.sayUntil = performance.now() + ms;
      };

      function drawTV() {
        const g = tvCtx,
          W = TW,
          H = TH,
          now = performance.now();
        g.imageSmoothingEnabled = false;
        g.fillStyle = COL.soot;
        g.fillRect(0, 0, W, H);
        g.textAlign = "center";
        g.textBaseline = "alphabetic";
        let noise = S.phase === "fight" ? 0.18 : 0.06;
        const text = (t, y, size, color = COL.bone, face = "Silkscreen", weight = 700) => {
          g.font = `${weight} ${size}px ${face}`;
          g.fillStyle = color;
          g.fillText(t, W / 2, y);
        };
        const fill = (color) => {
          g.fillStyle = color;
          g.fillRect(0, 0, W, H);
        };
        const band = (y, h, color = COL.soot) => {
          g.fillStyle = color;
          g.fillRect(0, y, W, h);
        };
        if (S.phase === "gate") {
          noise = 0.5;
        } else if (S.view === 2) {
          fill(COL.char);
          text("RESIDENT RECORDS", 42, 26);
          g.textAlign = "left";
          g.font = "20px DotGothic16";
          S.chars.forEach((c, i) => {
            g.fillStyle = c.alive ? COL.bone : COL.rust;
            g.fillText(
              `${num(c.id + 1)} ${c.ens.split(".")[0]}${c.alive ? "" : " †"}`,
              i < 16 ? 24 : 336,
              80 + (i % 16) * 24,
            );
          });
        } else if (
          S.phase === "vote" &&
          !S.cast &&
          (T.buf || (T.reveal >= 0 && now < T.revealUntil))
        ) {
          fill(COL.soot);
          noise = 0.14;
          if (T.reveal >= 0 && now < T.revealUntil) {
            const ch = S.chars[T.reveal];
            text(`RESIDENT ${num(ch.id + 1)}`, 150, 30, COL.sulfur);
            text(ch.name.toUpperCase(), 230, 44, COL.blood);
            text(S.picks.length === 2 ? "THANK YOU. GOOD NIGHT." : "ONE MORE.", 330, 26);
          } else {
            text(`${T.buf.padEnd(2, "_")}`, 170, 110);
            const n = +T.buf,
              ch = T.buf.length === 2 ? S.chars[n - 1] : null;
            if (T.buf.length < 2) text("TYPE TWO DIGITS", 280, 24, COL.rust);
            else if (!ch) text("NO SUCH RESIDENT", 280, 28, COL.rust);
            else if (!ch.alive) text("THIS ROOM IS EMPTY", 280, 28, COL.rust);
            else if (S.picks.includes(ch.id)) text("YOU ALREADY ASKED FOR THEM", 280, 24, COL.rust);
            else {
              g.font = "30px DotGothic16";
              g.fillStyle = COL.bone;
              wrap(g, `“${hint(ch)}”`, W / 2, 262, W - 100, 38);
              text("PRESS OK TO REQUEST", 420, 26, COL.sulfur);
            }
          }
        } else {
          const film = document.getElementById("film");
          if (S.phase === "vote") drawGuide(now);
          else if (vidMode && video.readyState >= 2) videoFrame();
          else if (film.width) g.drawImage(film, 20, 0, 120, 90, 0, 0, W, H);
          const [a, b] = (S.fighters || []).map((i) => S.chars[i]);
          if (S.phase === "story") {
            fill(COL.soot);
            text("TONIGHT'S EPISODE IS BEING WRITTEN", 90, 20, COL.rust);
            g.textAlign = "left";
            g.font = "28px DotGothic16";
            g.fillStyle = COL.bone;
            const y = wrap(g, S.story, 60, 170, W - 120, 36);
            g.fillText("WINNER: ████████", 60, y + 10);
            g.fillText("DAMAGE: ██", 60, y + 46);
            g.textAlign = "center";
          } else if (S.phase === "bet") {
            fill(COL.bone);
            text("WHO WALKS OUT?", 80, 44, COL.soot);
            [a, b].forEach((ch, i) => {
              const x = i ? W * 0.74 : W * 0.26;
              g.fillStyle = i ? COL.sulfur : COL.char;
              g.fillRect(x - 130, 130, 260, 150);
              g.fillStyle = i ? COL.soot : COL.bone;
              g.font = "700 40px Silkscreen";
              g.fillText(i ? "B" : "A", x, 180);
              g.font = "700 26px Silkscreen";
              g.fillText(ch.short, x, 228);
              g.font = "24px DotGothic16";
              g.fillText(`pays ×${odds(i)}`, x, 264);
            });
            if (S.bet)
              text(
                `${S.bet.amt} Ξ ON ${S.chars[S.fighters[S.bet.side]].short}. GOOD LUCK.`,
                360,
                26,
                COL.soot,
              );
            else if (S.credit <= 0) text("NO FUNDS. YOU CAN STILL WATCH.", 360, 24, COL.soot);
            else {
              text(`STAKE ${STAKES[T.stake]} Ξ  ·  VOL ± TO CHANGE`, 340, 24, COL.soot);
              text(
                T.hold >= 0
                  ? `${"▮".repeat(T.holdN)}${"▯".repeat(8 - T.holdN)}`
                  : "HOLD A OR B TO BET",
                390,
                26,
                COL.bloodDeep,
              );
            }
            text(`closes in ${mmss(S.t)}`, 450, 20, COL.rustDeep, "DotGothic16", 400);
          } else if (S.phase === "fight") {
            if (!vidMode && S.frame % 28 >= 22) {
              fill(COL.soot);
              text("PLEASE STAND BY", H / 2, 36);
            }
          } else if (S.phase === "settle") {
            const w = S.chars[S.fighters[S.winner]],
              l = S.chars[S.fighters[1 - S.winner]];
            fill(COL.soot);
            band(60, 50, COL.blood);
            text("WE INTERRUPT THIS PROGRAM", 96, 24, COL.soot);
            text(l.name.toUpperCase(), 200, 40, COL.blood);
            text("has left the program.", 248, 28, COL.bone, "DotGothic16", 400);
            text(`${w.name} walks on, bleeding.`, 290, 28, COL.bone, "DotGothic16", 400);
            if (S.claim) text(`PRESS OK TO COLLECT ${eth(S.claim)} Ξ`, 390, 26, COL.sulfur);
            else if (S.bet && S.result < 0) text(`YOU LOST ${eth(S.bet.amt)} Ξ`, 390, 26, COL.rust);
          } else if (S.phase === "over") {
            fill(COL.soot);
            const l = living();
            text("END OF PROGRAMMING", 200, 34);
            text(
              l[0] ? `${l[0].name} is the last one left.` : "Nobody is left.",
              250,
              28,
              COL.bone,
              "DotGothic16",
              400,
            );
            text("PRESS OK TO START AGAIN", 350, 24, COL.sulfur);
          }
        }
        if (S.phase !== "gate" && T.say && now < T.sayUntil) {
          band(H - 80, 56);
          text(T.say, H - 42, 26, COL.bone, "DotGothic16", 400);
        }
        if (S.phase !== "gate") {
          g.globalAlpha = 0.8;
          g.textAlign = "right";
          g.font = "700 18px Silkscreen";
          g.fillStyle = S.phase === "bet" && S.view === 1 ? COL.soot : COL.bone;
          g.fillText(`${living().length} LEFT · Ξ ${S.credit.toFixed(3)}`, W - 24, 40);
          g.globalAlpha = 1;
          g.textAlign = "center";
        }
        const img = g.getImageData(0, 0, W, H),
          d = img.data;
        for (let i = 0; i < d.length; i += 4) {
          const n = (Math.random() - 0.5) * 255 * noise;
          d[i] += n;
          d[i + 1] += n;
          d[i + 2] += n;
          if (((i / 4 / W) | 0) % 4 === 0) {
            d[i] *= 0.85;
            d[i + 1] *= 0.85;
            d[i + 2] *= 0.85;
          }
        }
        g.putImageData(img, 0, 0);
        const v = g.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 0.85);
        v.addColorStop(0, "rgba(0,0,0,0)");
        v.addColorStop(1, "rgba(0,0,0,0.5)");
        g.fillStyle = v;
        g.fillRect(0, 0, W, H);
        tvTex.needsUpdate = true;
      }

      function hintText() {
        const h = document.getElementById("hint");
        const b = (s) => `<b>${s}</b>`;
        h.innerHTML =
          S.phase === "gate"
            ? ""
            : S.phase === "vote" && !S.cast
              ? `Type a resident number ${b("0–9")}, then ${b("OK")}. You pick two. ${b("VOL ±")} flips the guide.`
              : S.phase === "bet" && !S.bet && S.credit > 0
                ? `${b("VOL ±")} changes your stake. ${b("Hold A or B")} to bet.`
                : S.claim
                  ? `${b("OK")} collects your winnings.`
                  : S.phase === "over"
                    ? `${b("OK")} starts again.`
                    : "";
      }

      function press(id) {
        const k = keyById[id];
        if (k) {
          k.position.z = 0.016;
          setTimeout(() => (k.position.z = 0.022), 120);
        }
        led.material.color.set(COL.blood);
        setTimeout(() => led.material.color.set(COL.bloodDeep), 120);
        if (S.phase === "gate") return;
        if (/^\d$/.test(id)) {
          if (S.phase === "vote" && !S.cast) {
            T.reveal = -1;
            T.buf = (T.buf.length >= 2 ? "" : T.buf) + id;
          }
        } else if (id === "clr") T.buf = "";
        else if (id === "ok") ok();
        else if (id === "+" || id === "-") {
          if (S.phase === "bet" && !S.bet)
            T.stake = Math.max(0, Math.min(2, T.stake + (id === "+" ? 1 : -1)));
          else if (S.phase === "vote") {
            T.page = (guidePage(performance.now()) + 1) % 2;
            T.pageAt = performance.now();
            T.buf = "";
          }
        }
        hintText();
      }
      function ok() {
        if (S.phase === "vote" && !S.cast && T.buf.length === 2) {
          const ch = S.chars[+T.buf - 1];
          if (!ch || !ch.alive || S.picks.includes(ch.id)) return;
          pick(ch.id);
          T.buf = "";
          T.reveal = ch.id;
          T.revealUntil = performance.now() + 3200;
          if (S.picks.length === 2) document.getElementById("h-cast").click();
        } else if (S.claim) {
          document.getElementById("h-claim").click();
          say("Collected.");
        } else if (S.phase === "over") document.getElementById("h-reset").click();
      }
      let holdTimer = 0;
      function holdStart(side) {
        if (S.phase !== "bet" || S.bet || holdTimer) return;
        if (STAKES[T.stake] > S.credit)
          return say(
            S.credit <= 0 ? "No funds. You can still watch." : "Not enough for that stake.",
          );
        T.hold = side;
        T.holdN = 0;
        keyById[side ? "B" : "A"].position.z = 0.016;
        holdTimer = setInterval(() => {
          T.holdN++;
          if (T.holdN >= 8) {
            holdEnd();
            S.side = side;
            S.amt = STAKES[T.stake];
            document.getElementById("h-bet").click();
            hintText();
          }
        }, 100);
      }
      function holdEnd() {
        clearInterval(holdTimer);
        holdTimer = 0;
        T.hold = -1;
        T.holdN = 0;
        keyById.A.position.z = keyById.B.position.z = 0.022;
      }

      const ray = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      const hitAt = (e) => {
        ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
        ray.setFromCamera(ndc, camera);
        const h = ray.intersectObjects(keys, false)[0];
        return h ? h.object.keyId : null;
      };
      const look = new THREE.Vector2();
      addEventListener("pointermove", (e) => {
        look.set((e.clientX / innerWidth) * 2 - 1, (e.clientY / innerHeight) * 2 - 1);
        canvas.classList.toggle("hot", !!hitAt(e));
      });
      canvas.addEventListener("pointerdown", (e) => {
        const id = hitAt(e);
        if (!id) return;
        if (id === "A" || id === "B") holdStart(id === "B" ? 1 : 0);
        else press(id);
      });
      addEventListener("pointerup", holdEnd);
      addEventListener(
        "keydown",
        (e) => {
          if (S.phase === "gate" || e.metaKey || e.ctrlKey || e.altKey) return;
          const k = e.key.toLowerCase();
          let id = null;
          if (/^\d$/.test(k)) id = k;
          else if (k === "enter") id = "ok";
          else if (k === "backspace" || k === "escape") id = "clr";
          else if (k === "+" || k === "=" || k === "arrowup") id = "+";
          else if (k === "-" || k === "arrowdown") id = "-";
          else if ((k === "a" || k === "b") && !e.repeat) {
            e.stopPropagation();
            return holdStart(k === "b" ? 1 : 0);
          }
          if (!id) return;
          e.stopPropagation();
          e.preventDefault();
          press(id);
        },
        true,
      );
      addEventListener("keyup", (e) => {
        if (e.key.toLowerCase() === "a" || e.key.toLowerCase() === "b") holdEnd();
      });

      const clock = new THREE.Clock();
      let lastPaint = 0;
      renderer.setAnimationLoop(() => {
        const t = clock.getElapsedTime();
        camera.position.set(0.1 + Math.sin(t * 0.6) * 0.008, 1.2 + Math.sin(t * 1.0) * 0.006, 0.28);
        camera.lookAt(0.16 + look.x * 0.12, 1.02 - look.y * 0.06, -1.4);
        const flick = Math.sin(t * 13) > 0.97 || Math.sin(t * 2.3 + 1) > 0.995 ? 0.3 : 1;
        bulbLight.intensity = 4 * flick;
        bulb.material.color.set(flick < 1 ? COL.grime : COL.sulfur);
        tvGlow.intensity =
          S.phase === "fight" ? 1.4 + Math.random() * 0.7 : S.phase === "bet" ? 2.4 : 1.1;
        syncVideo();
        if (t - lastPaint > 0.083) {
          lastPaint = t;
          drawTV();
        }
        renderer.render(scene, camera);
      });

      window.tick = () => {};
      window.render = () => {
        if (S.phase === "gate") return;
        if (T.phase !== S.phase) {
          const was = T.phase;
          T.phase = S.phase;
          T.buf = "";
          if (was === "vote" && !S.cast && S.phase === "story")
            say("You did not choose. Someone else did.", 4200);
          if (S.phase === "bet") T.stake = 1;
          holdEnd();
        }
        hintText();
      };
      document.fonts.ready.then(drawTV);
    </script>
  </body>
</html>
